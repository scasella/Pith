# How a tally/v1 deployment becomes a tally/v2 one, with its state (format: docs/rfc/0004-safe-evolution.md § 4).
# `python3 gate/migrate.py run` executes it: the populate script drives the OLD judged artifact's service to produce
# real version 1 state, the candidate's migrate command transforms it (twice: it must be idempotent), and the verify
# harness judges the NEW service on the migrated state. Frozen with the release.
format: pith.migration/v1
from: { pack: demo.tally, contract_version: tally/v1 }
to: { pack: demo.tally, contract_version: tally/v2 }
records: [M1]
state: the version 1 service's state directory (the --db path and anything beside it)
mapping: >
  every version 1 result (request_id, outcome, tally) becomes a version 2 result of counter "default" with the same
  request_id, outcome and tally; version 1's tally becomes counter "default"'s tally; nothing is dropped or re-decided
retries: >
  a version 1 client (no counter) retrying an old request_id gets the recorded result with replayed=true; a version 2
  client naming any counter gets the same recorded result, recorded for "default"
in_flight: >
  a request the version 1 service may or may not have recorded before it stopped is decided at most once: replayed if
  version 1 recorded it, decided by version 2 otherwise, and never both
rollback:
  policy: forward-only
  why: >
    once version 2 records a request for a counter other than "default", version 1 cannot represent the state; backing
    out is a forward repair in a new release, not a downgrade. Before any such request the state is still version 1
    compatible in content, but this release does not promise it.
populate: "{python} -I migrations/populate.py --old {old} --state {state} --out {observed}"
migrate: "{python} -I service/migrate.py --db {state}/tally.db"
verify: "{pytest} migrations/verify.py"
unrecognised: { files: { tally.db: "this is not a tally database\n" } }
