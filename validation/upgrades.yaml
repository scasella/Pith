# The contract upgrades of the main packs (docs/rfc/0006-upgrading-the-main-packs.md), judged by validation/upgrades.py.
# from_commit is where every previous release was published (v0.11.0 on main); old_release is the digest catalog.yaml
# recorded for it, which the rebuilt release must equal. `applications` are migrated from the same example at that
# commit (`old` when the path differs); the first one is the reference application. `contract_changes` are the
# records the classification must name; `holds` (default none) the checks it must say still hold: inputs, contract
# records and evaluator unchanged. v0.12.0 also changed the evaluator, which is part of every evidence key, so nothing
# holds for any pack (before that change: the reservation pack's kernel proof and design checks, 15 in all, and the
# other packs' manifest choices). Known-wrong
# migrations are overlays on a base application (<wrong_migrations>/<name>/ holds only what differs), listed in
# <wrong_migrations>/expected.yaml.
from_commit: 8e63d7b45cc3f104097c54b0686f19b177c366b3
packs:
  reservation:
    pack: .
    old_release: b6a58ad409fd80070f39c35e402dd3fb46e659be8b123c11b73b4f65e083ffa7
    applications: [{new: examples/build-a}, {new: examples/build-b}, {new: examples/club-desk}, {new: examples/office-desk}]
    contract_changes: {Receipts: added, MIG1: added}
