# The contract upgrades of the main packs (docs/rfc/0006-upgrading-the-main-packs.md), judged by validation/upgrades.py.
# from_commit is where every previous release was published (v0.11.0 on main); old_release is the digest catalog.yaml
# recorded for it, which the rebuilt release must equal. `applications` are migrated from the same example at that
# commit (`old` when the path differs); the first one is the reference application. `contract_changes` are the
# records the classification must name. Known-wrong migrations are overlays on a base application
# (<wrong_migrations>/<name>/ holds only what differs), listed in <wrong_migrations>/expected.yaml.
from_commit: 8e63d7b45cc3f104097c54b0686f19b177c366b3
packs:
  booking:
    pack: packs/booking
    old_release: 4b2171324020b247ee1675d207f7778e8a30fc1d21143e26c8b0b7a3d65de774
    applications: [{new: packs/booking/examples/calendar-py}, {new: packs/booking/examples/desk-node}, {new: packs/booking/examples/custom-py}]
    contract_changes: {B0: "version 1 -> 2", HalfOpen: "version 1 -> 2", B2: "version 1 -> 2", B5: "version 1 -> 2", M1: "version 1 -> 2",
                       BoundaryConformance: "version 1 -> 2", Turnaround: added, MIG1: added}
    holds: [candidate runtime, integration profile]     # the two manifest_choice preflights: they read only app.manifest.yaml runtime/profile and establish no record
    wrong_migrations: packs/booking/examples/wrong-migrations
