name: gate
on: [push, pull_request]
concurrency: { group: "gate-${{ github.ref }}", cancel-in-progress: true }
jobs:
  judge:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/cache@v6   # Dafny + TLC: fewer downloads from GitHub release hosting, which can fail transiently
        with: { path: .tools, key: "tools-${{ runner.os }}-${{ hashFiles('bootstrap.sh') }}" }
      - name: toolchain
        run: |
          # Ubuntu 24.04's AppArmor blocks the user namespaces Chromium's sandbox needs; allow them so the
          # browser workflows run sandboxed (browser_sandbox=true) rather than via SEED_ALLOW_UNSANDBOXED_BROWSER
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bash bootstrap.sh
          .venv/bin/python -m playwright install-deps chromium >/dev/null 2>&1 || true
          echo "DAFNY=$PWD/.tools/dafny/dafny" >> "$GITHUB_ENV"
          echo "TLA2TOOLS=$PWD/.tools/tla2tools.jar" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: release identity matches the seal
        run: |
          test "$(python3 gate/release.py id)" = "$(python3 -c 'import json;print(json.load(open("release.seal.json"))["release_digest"])')"
      - name: the evaluator is domain-free
        run: python3 validation/domain_free.py
      - name: client-state library tests
        run: node --test obligations/app/lib/test_pith_view.mjs
      - name: frozen unit suites
        run: |
          # the monitor suite tests the generated gen/out/monitor.py; generate it, then remove it so the next step sees a fresh seed
          python3 obligations/boundary/generate.py
          python3 -m pytest obligations/boundary/test_monitor.py profiles/sqlite/tests/test_profile.py -q -p no:cacheprovider --noconftest -c /dev/null
          rm -rf gen
      - name: fresh seed refuses at ring 1
        run: |
          set +e; python3 gate/app_gate.py --out "$RUNNER_TEMP/ev-seed" --expected-release "$(python3 gate/release.py id)" | tee seed.log; code=${PIPESTATUS[0]}; set -e
          test $code -eq 1 && grep -q "ring1 · design module present" seed.log
      - name: judge the examples with the pristine gate
        run: |
          set -o pipefail   # a failing judge must fail the step, not be hidden by tail
          for ex in build-a build-b club-desk office-desk; do   # examples/archive is not judged (conforms to an earlier release)
            validation/judge_example.sh "examples/$ex" "$RUNNER_TEMP/ev-$ex" | tail -1
          done
      - name: known-wrong fixtures are refused for exactly their defects
        run: python3 validation/judge_wrong.py "$RUNNER_TEMP"
      - name: failure categories and task packets (M4)
        run: |
          python3 -m pytest validation/test_packet.py -q -p no:cacheprovider
          python3 validation/packets.py "$RUNNER_TEMP/packets"
      - name: the machine is ready, and the pack is consistent (gate/cli.py doctor, pack check)
        run: |
          python3 gate/cli.py doctor
          python3 gate/cli.py pack check .
      - name: same scoped results as the v0.6.0 judge (M2 exit check)
        run: python3 validation/compare_m1.py compare "$RUNNER_TEMP"
      - name: evidence is invalidated by exactly what changed, and reused only where sound
        run: python3 validation/evidence_reuse.py "$RUNNER_TEMP/ev-build-a" "$RUNNER_TEMP/reuse"
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: evidence, path: "${{ runner.temp }}/ev-*\n${{ runner.temp }}/wrong-*", retention-days: 14 }

  packs:
    # M3: the booking and approval packs, judged by the same evaluator as the reservation pack (docs/rfc/0002-generality.md)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-node@v6
        with: { node-version: "22" }
      - uses: actions/cache@v6
        with: { path: .tools, key: "tools-${{ runner.os }}-${{ hashFiles('bootstrap.sh') }}" }
      - name: toolchain
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bash bootstrap.sh
          .venv/bin/python -m playwright install-deps chromium >/dev/null 2>&1 || true
          echo "DAFNY=$PWD/.tools/dafny/dafny" >> "$GITHUB_ENV"
          echo "TLA2TOOLS=$PWD/.tools/tla2tools.jar" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: each pack's release identity matches its seal, and a built release has the same identity
        run: |
          for pk in packs/booking packs/approval evolution/tally-v1 evolution/tally-v2; do
            id="$(python3 gate/release.py id --pack $pk)"
            test "$id" = "$(python3 -c "import json;print(json.load(open('$pk/release.seal.json'))['release_digest'])")"
            out="$RUNNER_TEMP/rel-$(basename $pk)"; python3 gate/release.py build --pack $pk --out "$out" >/dev/null
            test "$id" = "$(cd "$out" && python3 gate/release.py id)"; echo "$pk $id"
          done
      - name: the evaluator is domain-free across every pack
        run: python3 validation/domain_free.py
      - name: each pack is consistent (gate/cli.py pack check)
        run: for pk in packs/booking packs/approval evolution/tally-v1 evolution/tally-v2; do python3 gate/cli.py pack check $pk; done
      - name: booking pack examples (Python, Node.js, custom backends)
        run: |
          set -o pipefail
          for ex in calendar-py desk-node custom-py; do
            validation/judge_example.sh --pack packs/booking "packs/booking/examples/$ex" "$RUNNER_TEMP/ev-booking-$ex" | tail -1
          done
      - name: booking pack known-wrong apps are refused for exactly their defects
        run: python3 validation/judge_wrong.py --pack packs/booking "$RUNNER_TEMP"
      - name: approval pack examples (Python and Node.js stacks)
        run: |
          set -o pipefail
          for ex in approvals-py approvals-node adopt-handbook; do
            validation/judge_example.sh --pack packs/approval "packs/approval/examples/$ex" "$RUNNER_TEMP/ev-approval-$ex" | tail -1
          done
      - name: approval pack known-wrong apps are refused for exactly their defects
        run: python3 validation/judge_wrong.py --pack packs/approval "$RUNNER_TEMP"
      - name: an existing project adopts a pack (M4; docs/ADOPTING.md)
        run: python3 validation/adoption.py "$RUNNER_TEMP/adoption"
      - name: a scaffolded draft pack is judgeable as it comes (gate/cli.py pack new)
        run: |
          set -o pipefail
          D="$RUNNER_TEMP/scaffold/demo"
          python3 gate/cli.py pack new demo --out "$D" && python3 gate/release.py seal --pack "$D" && python3 gate/cli.py pack check "$D"
          validation/judge_example.sh --pack "$D" "$D/examples/basic" "$RUNNER_TEMP/ev-scaffold-basic" | tail -1
          python3 validation/judge_wrong.py --pack "$D" "$RUNNER_TEMP"
      - name: a composition contract tells a broken integration from a broken component (M5)
        run: python3 gate/cli.py compose check compositions/ledger-receipts
      - name: handoff, rewrite, contract upgrade with populated state, composition (M5 exit check)
        run: |
          python3 validation/evolution.py "$RUNNER_TEMP/evolution"
          python3 validation/judge_wrong.py --pack evolution/tally-v2 "$RUNNER_TEMP"
      - name: the catalog matches its packs; revocation and the experiment harness work end to end (M6)
        run: |
          python3 gate/catalog.py check
          python3 validation/governance.py "$RUNNER_TEMP/governance"
      - name: one evaluator, three packs (M3 exit check)
        run: |
          set -o pipefail
          validation/judge_example.sh examples/build-a "$RUNNER_TEMP/ev-reservation-build-a" | tail -1
          validation/judge_example.sh examples/club-desk "$RUNNER_TEMP/ev-reservation-club-desk" | tail -1
          python3 validation/generality.py "$RUNNER_TEMP"/ev-reservation-* "$RUNNER_TEMP"/ev-booking-* "$RUNNER_TEMP"/ev-approval-*
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: evidence-packs, path: "${{ runner.temp }}/ev-*\n${{ runner.temp }}/wrong-*\n${{ runner.temp }}/adoption\n${{ runner.temp }}/evolution\n${{ runner.temp }}/governance", retention-days: 14 }

  isolated:
    # the supported isolation profile, end to end: container build, judge as root, candidate and browser as separate
    # unprivileged users, no network; the run must observe isolation as enforced and pass the reference build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: judge build-a in the isolation profile
        run: |
          pip install -q pyyaml
          CAND="$(mktemp -d)"; for d in $(python3 gate/release.py dirs); do cp -r "$d" "$CAND/$d"; done
          cp pack.yaml release.seal.json "$CAND/"; cp -r examples/build-a/. "$CAND/"; rm -f "$CAND/claims-from-release.json" "$CAND"/*.example
          set +e; gate/isolation/judge-isolated.sh "$PWD" "$CAND" "$RUNNER_TEMP/ev-isolated" "$(python3 gate/release.py id)"; code=$?; set -e
          sudo chmod -R a+rX "$RUNNER_TEMP/ev-isolated"
          python3 - "$RUNNER_TEMP/ev-isolated/run/app-claims.json" <<'PY'
          import json, sys
          c = json.load(open(sys.argv[1])); i = c["isolation"]
          print(json.dumps(i["observed"], indent=1)); print("missing for release_ready:", c.get("release_ready_missing"), "failed checks:", [x for x in c["checks"] if x["result"] == "fail"])
          assert i["status"] == "enforced", i["reachable_from_candidate"]
          assert c["behavioral_assurance"].startswith("passed") and c["application_delivery"] == "passed", c.get("delivery_detail")
          assert c["delivery_detail"]["browser"]["browser_user"] == "uid 10002"
          assert c["release_ready_missing"] == ["human_approval"], c["release_ready_missing"]
          PY
          exit $code
      - name: diagnose the isolation image (on failure)
        if: failure()
        run: |
          TAG="pith-judge:$(sha256sum gate/isolation/Containerfile | cut -c1-16)"
          docker run --rm --network none --read-only --tmpfs /tmp:rw,exec,size=4g --memory 6g --cpus 2 --pids-limit 1024 --cap-drop ALL --cap-add CHOWN --cap-add SETUID --cap-add SETGID \
            --cap-add DAC_OVERRIDE --cap-add FOWNER --cap-add KILL --security-opt no-new-privileges -v "$PWD":/pith:ro "$TAG" sh -c '
            set -x; id; echo "HOME=$HOME DAFNY=$DAFNY"; ls -la /opt/tools /opt/tools/dafny | head -30
            "$DAFNY" --version; echo "rc=$?"
            cd /tmp && printf "lemma L() ensures 1 + 1 == 2 {}\n" > t.dfy && "$DAFNY" verify t.dfy; echo "rc=$?"
            ulimit -a; nproc; cp -r /pith/kernel /tmp/k && "$DAFNY" verify --verify-included-files /tmp/k/core/Kernel.dfy; echo "rc=$?"
            cd /tmp && rm -rf ev && mkdir ev && cp -r /pith /tmp/p && cd /tmp/p && DAFNY=$DAFNY python -I kernel/gate/gate.py kernel/core/Kernel.dfy --out /tmp/claims.json; echo "rc=$?"
            java -version; python -c "import playwright, yaml; print(\"py ok\")"' 2>&1 | tail -60
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: evidence-isolated, path: "${{ runner.temp }}/ev-isolated", retention-days: 14 }
