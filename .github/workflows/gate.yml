name: gate
on: [push, pull_request]
concurrency: { group: "gate-${{ github.ref }}", cancel-in-progress: true }
jobs:
  judge:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/cache@v6   # Dafny + TLC: fewer downloads from GitHub release hosting, which can fail transiently
        with: { path: .tools, key: "tools-${{ runner.os }}-${{ hashFiles('bootstrap.sh') }}" }
      - name: toolchain
        run: |
          # Ubuntu 24.04's AppArmor blocks the user namespaces Chromium's sandbox needs; allow them so the
          # browser workflows run sandboxed (browser_sandbox=true) rather than via SEED_ALLOW_UNSANDBOXED_BROWSER
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bash bootstrap.sh
          .venv/bin/python -m playwright install-deps chromium >/dev/null 2>&1 || true
          echo "DAFNY=$PWD/.tools/dafny/dafny" >> "$GITHUB_ENV"
          echo "TLA2TOOLS=$PWD/.tools/tla2tools.jar" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: release identity matches the seal
        run: |
          test "$(python3 gate/release.py id)" = "$(python3 -c 'import json;print(json.load(open("release.seal.json"))["release_digest"])')"
      - name: frozen unit suites
        run: |
          # the monitor suite tests the generated gen/out/monitor.py; generate it, then remove it so the next step sees a fresh seed
          python3 obligations/boundary/generate.py
          python3 -m pytest obligations/boundary/test_monitor.py profiles/sqlite/tests/test_profile.py -q -p no:cacheprovider --noconftest -c /dev/null
          rm -rf gen
      - name: fresh seed refuses at ring 1
        run: |
          set +e; python3 gate/app_gate.py --out "$RUNNER_TEMP/ev-seed" --expected-release "$(python3 gate/release.py id)" | tee seed.log; code=${PIPESTATUS[0]}; set -e
          test $code -eq 1 && grep -q "ring1 · design module present" seed.log
      - name: judge the examples with the pristine gate
        run: |
          set -o pipefail   # a failing judge must fail the step, not be hidden by tail
          for ex in build-a build-b agent-build-hold-desk; do
            validation/judge_example.sh "examples/$ex" "$RUNNER_TEMP/ev-$ex" | tail -1
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: evidence, path: "${{ runner.temp }}/ev-*", retention-days: 14 }
