# The catalog of packs this project maintains (format pith.catalog/v1; GOVERNANCE.md § The catalog).
# An entry is a statement about a pack, never a certification that an application using it is correct.
# `python3 gate/catalog.py check` holds every entry to its pack in CI; `gate/catalog.py pin` rewrites release_digest
# after a reseal. `stage` is derived by `gate/cli.py pack check` and cannot be claimed: every pack is `draft` until a
# reviewer who is not one of its maintainers signs a release review (none has yet).
format: pith.catalog/v1
packs:
  - id: pith.reservation
    path: .
    version: 0.13.0
    status: supported
    stage: draft
    release_digest: 5d7f29267112f767f306ce1c8a4c37e154b986d5659cdac794d105a9df4f0b80
    scope: >
      authorization against a limit with reservations, release and capture (posting), over a proven Dafny core; an
      agent-written TLA+ design, service and browser application around it
    assumptions: kernel/tcb.yaml
    examples: [examples/build-a, examples/build-b, examples/build-occ, examples/club-desk, examples/office-desk]
    wrong: [examples/wrong/club-desk, examples/wrong/office-desk, examples/wrong/retry-not-released, examples/wrong/split-decision, examples/wrong-migrations/skips-declines, examples/wrong-migrations/stamps-history]
    profiles: [sqlite (shipped), sqlite-occ (shipped, optimistic concurrency), custom (judged black-box)]
    reference_implementations: [examples/build-a, examples/build-b]
    evidence: "CI job judge: every example judged with the pristine release, the known-wrong fixtures, the M2 baseline, the wrong-candidate matrix (docs/VALIDATION.md)"
    upgrade_policy: "0.13.0 (v0.13.0, docs/rfc/0007-autonomous-assurance-and-runtime-composition.md) adds the sqlite-occ profile, a deterministic interleaving test, the shadow oracle and partitions; contract unchanged (authorization-and-posting/v3), so no migration; 0.12.0 upgraded authorization-and-posting-core/v2 to authorization-and-posting/v3 with a forward-only migration (migrations/from-v2.yaml; docs/rfc/0006-upgrading-the-main-packs.md); 0.11.0 stays supported for 90 days so deployments can upgrade through it (GOVERNANCE.md)"
    maintainers: [scasella]
    reviews: []
  - id: pith.booking
