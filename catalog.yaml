    upgrade_policy: "0.3.0 adds a deterministic interleaving test (RFC 0007 § 6); contract unchanged (sliding-window-quota/v2); 0.2.0 upgraded sliding-window-quota/v1 to sliding-window-quota/v2 with a forward-only migration (migrations/from-v1.yaml; docs/rfc/0006-upgrading-the-main-packs.md); 0.1.1 stays supported for 90 days so deployments can upgrade through it (GOVERNANCE.md)"
    maintainers: [outside-author, scasella]   # scasella made the 0.2.0 upgrade; the author has not reviewed it (packs/quota/AUTHORING-NOTES.md)
