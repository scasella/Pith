# examples/wrong/expected.yaml — known-wrong release fixtures and the verdict the pristine gate must reach.
# Checked by validation/judge_wrong.py (and CI). Each fixture must pass behavioral assurance (its protected platform
# and service are intact; the defects are in the interface) and FAIL application delivery on EXACTLY these
# interaction obligations — no fewer (the defect is caught) and no more (it is caught for the right reason).
club-desk:
  source: "Club Desk as submitted for the 2026-10-13 review; UI logic unchanged, contract markup added (ui.contract-markup.diff)"
  must_fail: [I2, I4, I5, I6]
  review_findings:
    I2: "High-priority finding 1, Club Desk: after a failed account load, Release/Capture target the account that failed to load"
    I4: "High-priority finding 2: a received AUTHORIZED receipt is overwritten with ERROR when the refresh fails"
    I5: "High-priority finding 2: 'The service did not return a decision' for every failure class"
    I6: "Related finding: receipt scope is missing on account switches"
office-desk:
  source: "Office Desk as submitted for the 2026-10-13 review; UI logic unchanged, contract markup added (ui.contract-markup.diff)"
  must_fail: [I1, I2, I3, I4, I5, I6]
  review_findings:
    I1: "High-priority finding 1, Office Desk: editing the account field without Load retargets the displayed hold's actions"
    I2: "High-priority finding 1 (same cause): a failed load leaves rows whose actions follow the field"
    I3: "Required correction: discard late responses belonging to a superseded account selection (not reproduced in the review; found by I3)"
    I4: "High-priority finding 2: a received AUTHORIZED receipt is overwritten with ERROR when the refresh fails"
    I5: "High-priority finding 2: every failure class shown as ERROR"
    I6: "Related finding: receipt scope is missing on account switches"
