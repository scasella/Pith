<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auth desk</title>
<style>body{font:14px ui-monospace,monospace;background:#111;color:#ddd;margin:0;padding:1rem}h1{font-size:1rem;color:#fff}form{display:inline-block;margin:0 1rem .6rem 0}input{width:5rem;background:#222;color:#eee;border:1px solid #444;padding:.2rem}
button{background:#333;color:#eee;border:1px solid #555;padding:.2rem .6rem;cursor:pointer}#out{white-space:pre;border:1px solid #333;padding:.6rem;margin-top:.6rem;min-height:6rem}
.AUTHORIZED{color:#7fd;font-weight:700}.DECLINED{color:#f76;font-weight:700;text-decoration:underline}table{border-collapse:collapse}td,th{padding:.15rem .6rem;border-bottom:1px solid #333}</style></head>
<body><h1>Auth desk · decisions are the service's; this page computes nothing</h1>
<form onsubmit="go('create');return false">acct <input id="a" data-testid="acct-id" value="1"> limit <input id="l" data-testid="acct-limit" value="100"> <button data-testid="btn-create">create</button></form>
<form onsubmit="go('auth');return false">req <input id="r" data-testid="req-id" value="1"> amount <input id="m" data-testid="req-amount" value="60"> <button data-testid="btn-authorize">authorize</button></form>
<form onsubmit="go('rel');return false">release req <input id="x" value="1"> <button>release</button></form>
<button onclick="refresh()">refresh</button>
<div id="dec"></div><p>available: <span data-testid="available" id="avail"></span> · posted: <span data-testid="posted" id="posted"></span></p><table id="h"><thead><tr><th>hold</th><th>amount</th><th></th></tr></thead><tbody></tbody></table><pre id="out" data-testid="events"></pre>
<script>
const v=id=>+document.getElementById(id).value, api=async(m,p,b)=>{const r=await fetch(p,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});return r.json();};
async function go(k){const a=v('a');let r;
 if(k==='create')r=await api('POST','/accounts',{id:a,limit:v('l')});
 if(k==='auth'){r=await api('POST',`/accounts/${a}/authorize`,{request_id:v('r'),amount:v('m')});document.getElementById('dec').innerHTML=r.error?`<p data-testid="decision" data-decision="ERROR">${r.error}</p>`:`<p data-testid="decision" data-decision="${r.decision}" class="${r.decision}">req ${r.request_id}: ${r.decision}${r.replayed?' (replay of the original receipt)':''}</p>`;document.getElementById('r').value=v('r')+1;}
 if(k==='rel')r=await api('POST',`/accounts/${a}/release`,{request_id:v('x')});
 refresh();return false;}
async function rel(k){await api('POST',`/accounts/${v('a')}/release`,{request_id:k});refresh();}
async function cap(k){await api('POST',`/accounts/${v('a')}/capture`,{request_id:k});refresh();}
async function refresh(){const a=v('a');const s=await api('GET',`/accounts/${a}`);const ev=await api('GET','/events');
 document.getElementById('avail').textContent=s.error?'':s.available; document.getElementById('posted').textContent=s.error?'':s.posted;
 document.querySelector('#h tbody').innerHTML=Object.entries(s.holds||{}).map(([k,x])=>`<tr data-testid="hold-row" data-request-id="${k}"><td>${k}</td><td>${x}</td><td><button data-testid="btn-release" onclick="rel(${k})">release</button> <button data-testid="btn-capture" onclick="cap(${k})">capture</button></td></tr>`).join('');
 document.getElementById('out').textContent=(s.error?s.error:`limit ${s.limit}  posted ${s.posted}  available ${s.available}\n`)+'\nevents (monitor view):\n'+ev.slice(-20).map(e=>e.type+' '+JSON.stringify(e)).join('\n');}
</script></body></html>
