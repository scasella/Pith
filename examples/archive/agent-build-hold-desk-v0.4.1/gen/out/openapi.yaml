openapi: 3.0.3
info:
  title: authorization-core service
  version: '1'
  description: 'Generated from kernel/spec/AuthSpec.dfy and kernel/glossary.yaml by
    obligations/boundary/generate.py. Do not edit.

    Requirement: When an authorization request exceeds the account''s available limit,
    the system shall decline the request and shall not reserve funds. Requests within
    the limit, equality included, are authorized and reserved.'
paths:
  /accounts:
    post:
      summary: Create account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - limit
              properties:
                id:
                  type: integer
                limit:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
      responses:
        '201':
          description: created
  /accounts/{id}:
    get:
      summary: Account state (Account datatype plus derived available)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountView'
  /accounts/{id}/authorize:
    post:
      summary: Decide(a, Request(request_id, amount)); request_id is the idempotency
        key
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizeRequest'
      responses:
        '200':
          description: decided (or replayed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizeResponse'
  /accounts/{id}/release:
    post:
      summary: Release(a, request_id)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - request_id
              properties:
                request_id:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
      responses:
        '200':
          description: released or no-op
  /events:
    get:
      summary: Event stream the monitor reads
      parameters:
      - name: since
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
components:
  schemas:
    Decision:
      type: string
      enum:
      - AUTHORIZED
      - DECLINED
      description: Dafny Decision constructors ['Authorized', 'Declined'], upper-cased
        on the wire
    Status: &id001
      type: string
      enum:
      - AUTH
      - DECL
      - REL
      description: Dafny Status constructors ['Auth', 'Decl', 'Rel'], upper-cased
        on the wire
    Request:
      type: object
      required:
      - id
      - amount
      properties:
        id:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        amount:
          type: integer
          minimum: 0
          maximum: 9007199254740991
    Account:
      type: object
      required:
      - limit
      - posted
      - holds
      - status
      properties:
        limit:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        posted:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        holds:
          type: object
          description: Dafny map<ReqId, nat>; keys are request ids as strings
          additionalProperties: true
        status:
          type: object
          description: Dafny map<ReqId, Status>; keys are request ids as strings
          additionalProperties: true
    AuthorizeRequest:
      type: object
      required:
      - request_id
      - amount
      additionalProperties: false
      properties:
        request_id:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        amount:
          type: integer
          minimum: 1
          maximum: 9007199254740991
    AuthorizeResponse:
      type: object
      required:
      - request_id
      - decision
      properties:
        request_id:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        decision:
          type: string
          enum:
          - AUTHORIZED
          - DECLINED
        available_at_decision:
          type: integer
        replayed:
          type: boolean
      additionalProperties: false
    AccountView:
      type: object
      required:
      - id
      - limit
      - posted
      - available
      - holds
      - status
      properties:
        id:
          type: integer
        limit:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        posted:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        available:
          type: integer
        holds:
          type: object
          additionalProperties:
            type: integer
            minimum: 1
        status:
          type: object
          additionalProperties: *id001
      additionalProperties: false
    Event:
      $ref: events.schema.json
x-obligations:
- D
- F
- INV1
- P0
- P1
- P2
- P2'
- P3
- R1
- R2
