# gate/policy.yaml — acceptance policy. FROZEN. The gate reads paths from here, never from the manifest.
kernel:
  spec: kernel/spec/AuthSpec.dfy
  impl: kernel/core/Kernel.dfy
  gate: kernel/gate/gate.py
  claims: kernel/core/claims.json
candidate:
  entrypoint: service/run.py                # started by the supervisor as a separate process: python -I service/run.py --port P --db D
  owned_dirs: [design, service, app, ui, adapter, gen]   # plus app.manifest.yaml; these form the deployment artifact
rings:
  1:
    design_module: design/Design.tla
    obligations_dir: obligations/design
    required_cfg: required.cfg
    coverage_list: coverage.list
    broken: { module: MCBroken.tla, cfg: broken.cfg, expect: INV1 }
    lifecycle: obligations/service/lifecycle.py          # black-box, through the running service
    sqlite_profile_tests: profiles/sqlite/tests/test_profile.py   # in-process; run only for profile: sqlite (frozen code)
  2:
    generator: obligations/boundary/generate.py
    generated: [gen/out/openapi.yaml, gen/out/events.schema.json, gen/out/monitor.py]
    harness: obligations/boundary/harness.py
    monitor_tests: obligations/boundary/test_monitor.py
  3:
    spec: app/SPEC.md
    lint: obligations/app/lint.py
    delivery: obligations/app/delivery.yaml
    browser: obligations/app/browser_workflows.py
    ui_contract: obligations/app/UI-CONTRACT.md
review:
  tool: gate/review.py
manifest_allowlist: [name, profile, extra_tests, ui_entry]   # profile: sqlite (shipped) | custom (your own adapter, judged black-box)
pytest_args: "-q -p no:cacheprovider --noconftest -c /dev/null"
