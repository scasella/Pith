# packs/booking/examples/wrong/expected.yaml — known-wrong pith.booking candidates and the verdict the pristine gate must
# reach (validation/judge_wrong.py --pack packs/booking, and CI). Each is a correct example (../custom-py) with ONE
# defect, marked DEFECT in its source. A refused candidate must be refused at exactly `refused_at`, by exactly the
# `failing_tests`; a delivery defect must pass behavioral assurance and fail exactly `must_fail`. Since v0.9.0 the task
# packet must put the first failure in `category` and name at least `contracts` (gate/packet.py).
closed-intervals:
  source: custom-py with closed-interval overlap (s1 <= e2 and s2 <= e1), the service-level twin of spec/wrong/closed_intervals.dfy
  refused_at: service.lifecycle
  failing_tests: [test_half_open_intervals_conflicts_and_independent_resources, test_reschedule_is_atomic,
                  test_the_buffer_separates_bookings_on_its_resource, test_moves_and_cancels_respect_the_buffer, test_the_buffer_is_fixed_at_creation_and_survives_restart]   # 0.12.0: the same defect at the buffered end refuses a booking exactly the buffer away
  may_also_fail: [test_concurrent_overlapping_bursts_keep_calendars_conflict_free, test_concurrent_bursts_keep_the_buffer]   # when a touching (or exactly-the-buffer) interval wins the race, the loser's conflict names it
  category: violation
  contracts: [HalfOpen]
check-then-insert:
  source: custom-py whose availability check and insert are separate critical sections
  refused_at: service.lifecycle
  failing_tests: [test_concurrent_requests_for_one_interval_accept_exactly_one_per_resource, test_concurrent_overlapping_bursts_keep_calendars_conflict_free,
                  test_interleaved_bookings_of_one_interval_accept_exactly_one]          # 0.13.0: the deterministic test: 6 of its 30 schedules double-book, the same first one on every run
  may_also_fail: [test_concurrent_bursts_keep_the_buffer]          # 0.12.0: the same race in a burst on a resource with a buffer
  category: violation
  contracts: [Atomicity, B0]
move-loses-booking:
  source: custom-py whose move is cancel-then-book, the service-level twin of spec/wrong/reschedule_cancel_then_book.dfy
  refused_at: service.lifecycle
  failing_tests: [test_reschedule_is_atomic, test_moves_and_cancels_respect_the_buffer]   # 0.12.0: the buffer test's refused move also loses the booking
  category: violation
  contracts: [M3]
buffer-ignored-on-move:
  source: custom-py whose move checks plain overlap (the buffer is kept for new bookings only), the service-level twin of spec/wrong/reschedule_ignores_buffer.dfy (new in 0.12.0)
  refused_at: service.lifecycle
  failing_tests: [test_moves_and_cancels_respect_the_buffer]
  category: violation
  contracts: [M1, Turnaround]
receipt-overwritten:
  source: custom-py whose page overwrites the receipt when a refresh fails and reports a lost response as a failure
  must_fail: [BI1, BI2]
  category: violation
  contracts: [BI1, BI2]
