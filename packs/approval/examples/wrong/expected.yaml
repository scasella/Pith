# packs/approval/examples/wrong/expected.yaml — known-wrong pith.approval candidates and the verdict the pristine gate
# must reach (validation/judge_wrong.py --pack packs/approval, and CI). Each is a correct example with ONE defect,
# marked DEFECT in its source. A refused candidate must be refused at exactly `refused_at`, by exactly the
# `failing_tests`; a delivery defect must pass behavioral assurance and fail exactly `must_fail`. Since v0.9.0 the task
# packet must put the first failure in `category` and name at least `contracts` (gate/packet.py).
stale-approvals-counted:
  source: approvals-py whose quorum counts approvals of every revision, the service-level twin of model/wrong/WrongStaleApprovals.tla
  refused_at: service.lifecycle
  failing_tests: [test_approvals_are_bound_to_a_revision_and_stale_ones_never_count]
  category: violation
  contracts: [A3]
self-approval:
  source: approvals-node with no separation of duties, the service-level twin of model/wrong/WrongSelfApproval.tla
  refused_at: service.lifecycle
  failing_tests: [test_separation_of_duties_is_per_revision, test_replays_are_idempotent_and_conflicting_reuse_is_rejected]
  category: violation
  contracts: [A1]
unknown-as-refused:
  source: approvals-py whose CLI reports "no answer" as a refusal
  must_fail: [AI1, AI2]
  category: violation
  contracts: [AI1, AI2]
adopt-handbook-stale:
  source: examples/adopt-handbook (an existing project adopting the pack) as it was before the fix its adoption led to; its quorum counts every revision's votes
  refused_at: service.lifecycle
  failing_tests: [test_approvals_are_bound_to_a_revision_and_stale_ones_never_count]
  category: violation
  contracts: [A3]
